<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <h1>My Dashboard</h1>
    </header>

    <main class="dashboard-grid">
      <div class="card">
        <h2>Card 1</h2>
        <p>Some content for this card.</p>
      </div>

      <div class="card">
        <h2>Card 2</h2>
        <p>Another card with some text.</p>
      </div>

      <div class="card">
        <h2>Card 3</h2>
        <p>More content goes here.</p>
      </div>

      <div class="card">
        <h2>Card 4</h2>
        <p>You can add charts, stats, etc.</p>
      </div>
    </main>
  </div>
</body>
</html>
