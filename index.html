<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Trading Card DB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.1" />
  <link rel="stylesheet" href="about.css" />
</head>

<body>

  <nav class="top-nav">
    <div class="nav-left">
      <img src="https://api.dicebear.com/9.x/shapes/svg?seed=Profile" alt="Profile" class="profile-icon" />
    </div>
    <div class="nav-center">
      <a href="index.html" class="tab active">Home</a>
      <a href="About.html" class="tab">About</a>
      <a href="dashboard.html" class="tab" id="navDashboard" style="display: none;">Dashboard</a>
      <a href="signin.html" class="nav-signin-btn" id="navSigninBtn">Sign In</a>
    </div>
  </nav>

  <header class="header">
    <h1>Card Database</h1>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search by name or number..." class="search-bar"
        autocomplete="off" />
    </div>
  </header>

  <main class="dashboard-grid" id="dashboardGrid"></main>

  <!-- Card Modal Overlay -->
  <div id="cardModal" class="modal-overlay hidden">
    <div class="modal-container">
      <div class="modal-card" id="modalCard">
        <div class="modal-card-inner" id="modalCardInner">
          <div class="modal-card-front" id="modalCardFront">
          </div>
          <div class="modal-card-back" id="modalCardBack">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDataString = "";
    let currentCardsList = [];

    function openModal(card) {
      const modalOverlay = document.getElementById("cardModal");
      const modalCardInner = document.getElementById("modalCardInner");
      const modalCardFront = document.getElementById("modalCardFront");
      const modalCardBack = document.getElementById("modalCardBack");

      modalCardInner.classList.remove("is-flipped");

      modalCardFront.innerHTML = `
        <div class="card-number" style="top: 15px; right: 20px; font-size: 1.1rem; padding: 0.4rem 0.8rem;">#${card.cardNumber || '000'}</div>
        <div class="card-content" style="background: ${card.bg_color || '#020617'}; border-radius: 1.5rem; padding: 1rem;">
          <div class="card-img-container" style="height: 65%;">
            <img src="${card.image || 'https://via.placeholder.com/300x400?text=No+Image'}" alt="${card.title}" class="card-img" />
          </div>
          <div class="card-info" style="border-radius: 1rem;">
            <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; border-color: rgba(255,255,255,0.2);">${card.title}</h2>
          </div>
        </div>
      `;

      modalCardBack.style.background = card.bg_color || '#020617';
      modalCardBack.innerHTML = `
        <div class="back-content">
          <h2>${card.title}</h2>
          <div class="back-details">
            <p><strong>Creator:</strong> ${card.creator || 'Unknown'}</p>
            <p><strong>Location:</strong> ${card.location || 'Unknown'}</p>
            <div class="back-text">${card.text || ''}</div>
          </div>
          <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-top: auto;">Click outside to close</p>
        </div>
      `;

      modalOverlay.classList.remove("hidden");
      // slight delay to trigger CSS opacity transition
      setTimeout(() => {
        modalOverlay.classList.add("visible");
        // Automatically animate the flip as it opens
        modalCardInner.classList.add("is-flipped");
      }, 50);
    }

    function closeModal() {
      const modalOverlay = document.getElementById("cardModal");
      modalOverlay.classList.remove("visible");
      setTimeout(() => {
        modalOverlay.classList.add("hidden");
      }, 300);
    }

    // Modal Events
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("cardModal").addEventListener("click", (e) => {
        if (e.target.closest('.modal-card')) {
          document.getElementById("modalCardInner").classList.toggle('is-flipped');
          return;
        }
        closeModal(); // Clicking outside the card closes it
      });
    });


    function renderCards(cards) {
      const grid = document.getElementById("dashboardGrid");
      grid.innerHTML = ""; // Clear existing

      cards.forEach((card, index) => {
        const div = document.createElement("div");
        div.className = "card";
        // Staggered pop-in animation
        div.style.animationDelay = `${index * 0.1}s`;

        div.innerHTML = `
          <div class="card-number">#${card.cardNumber || '000'}</div>
          <div class="card-content" style="background: ${card.bg_color || '#020617'};">
            <div class="card-img-container">
              <img src="${card.image || 'https://via.placeholder.com/300x400?text=No+Image'}" alt="${card.title}" class="card-img" />
            </div>
            <div class="card-info">
              <h2>${card.title}</h2>
              <p>${card.text}</p>
            </div>
          </div>
        `;

        // Add 3D mouse move effect and dynamic glare
        div.addEventListener('mousemove', (e) => {
          const rect = div.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          // Calculate rotation
          const rotateX = ((y - centerY) / centerY) * -12; // Max 12 deg tilt
          const rotateY = ((x - centerX) / centerX) * 12;

          // Pointer percentages for glare position
          const px = (x / rect.width) * 100;
          const py = (y / rect.height) * 100;

          div.style.setProperty('--rx', rotateX + 'deg');
          div.style.setProperty('--ry', rotateY + 'deg');
          div.style.setProperty('--mx', px + '%');
          div.style.setProperty('--my', py + '%');
        });

        div.addEventListener('mouseleave', () => {
          // Reset positioning
          div.style.setProperty('--rx', '0deg');
          div.style.setProperty('--ry', '0deg');
          div.style.setProperty('--mx', '50%');
          div.style.setProperty('--my', '50%');
        });

        div.addEventListener('click', () => {
          openModal(card);
        });

        grid.appendChild(div);
      });
    }

    function fetchCards() {
      // Append timestamp parameter to force bypass of browser cache
      fetch("cards.json?t=" + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          const newDataString = JSON.stringify(data);
          // Re-render ONLY if data has changed (prevents flickering)
          if (newDataString !== currentDataString) {
            currentDataString = newDataString;
            currentCardsList = data.cards || [];

            // Respect search filter immediately upon data refresh
            const searchTerm = document.getElementById("searchInput").value.toLowerCase();
            const filteredCards = currentCardsList.filter(card => {
              const nameMatch = card.title && card.title.toLowerCase().includes(searchTerm);
              const numMatch = card.cardNumber && card.cardNumber.toString().toLowerCase().includes(searchTerm);
              return nameMatch || numMatch;
            });

            renderCards(filteredCards);
          }
        })
        .catch(err => console.error("Error fetching cards:", err));
    }

    // Filter cards as the user types
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filteredCards = currentCardsList.filter(card => {
        const nameMatch = card.title && card.title.toLowerCase().includes(searchTerm);
        const numMatch = card.cardNumber && card.cardNumber.toString().toLowerCase().includes(searchTerm);
        return nameMatch || numMatch;
      });
      renderCards(filteredCards);
    });

    // Initial fetch
    fetchCards();

    // Poll every 1.5 seconds so when user saves cards.json, it updates fast
    setInterval(fetchCards, 1500);
  </script>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
    import { setupNavAuth } from "./auth-ui.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDs1JZXpgr-IZdjI8Uoc0AREm_ur3eqnOM",
      authDomain: "nyccardbase.firebaseapp.com",
      projectId: "nyccardbase",
      storageBucket: "nyccardbase.firebasestorage.app",
      messagingSenderId: "964924272872",
      appId: "1:964924272872:web:069f2e91bcc4c2d5d1195d",

  </script>

</body>

</html>
