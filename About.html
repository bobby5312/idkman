<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us - Custom Trading Card DB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2.1" />
    <link rel="stylesheet" href="about.css" />
</head>

<body>

    <nav class="nav-tabs">
        <a href="index.html" class="tab">Home</a>
        <a href="About.html" class="tab active">About</a>
        <a href="dashboard.html" class="tab" id="navDashboard" style="display: none;">Dashboard</a>
        <a href="signin.html" class="tab">Sign In</a>
    </nav>

    <header class="header">
        <h1>About Our Team</h1>
        <p>The contributors making this possible</p>
    </header>

    <main class="about-container" id="aboutContainer"></main>

    <script>
        function renderAbout(data) {
            const container = document.getElementById("aboutContainer");
            container.innerHTML = "";

            // Contributors section
            if (data.contributors && data.contributors.length > 0) {
                const contributorSection = document.createElement("section");
                contributorSection.className = "about-section";
                contributorSection.innerHTML = `<h2>Contributors</h2>`;
                const grid = document.createElement("div");
                grid.className = "person-grid";

                data.contributors.forEach((person, index) => {
                    const card = document.createElement("div");
                    card.className = "person-card";
                    card.style.animationDelay = `${index * 0.1}s`;
                    card.innerHTML = `
            <div class="person-img-container">
              <img src="${person.image || 'https://via.placeholder.com/150'}" alt="${person.name}" class="person-img" />
            </div>
            <div class="person-info">
              <h3>${person.name}</h3>
              <span class="role">${person.role}</span>
              <p>${person.description || ''}</p>
            </div>
          `;
                    grid.appendChild(card);
                });
                contributorSection.appendChild(grid);
                container.appendChild(contributorSection);
            }

            // About Us paragraph section
            if (data.about_us) {
                const aboutUsSection = document.createElement("section");
                aboutUsSection.className = "about-section";
                aboutUsSection.style.marginTop = "2rem";
                aboutUsSection.innerHTML = `
                    <h2>Our Mission</h2>
                    <div style="background: rgba(15, 23, 42, 0.6); padding: 2rem; border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);">
                        <p style="font-size: 1.2rem; color: #cbd5e1; line-height: 1.8;">${data.about_us}</p>
                    </div>
                `;
                aboutUsSection.style.animation = "popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) both";
                container.appendChild(aboutUsSection);
            }
        }

        function fetchAbout() {
            fetch("about.json?t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    renderAbout(data);
                })
                .catch(err => console.error("Error fetching about data:", err));
        }

        // Initial fetch
        fetchAbout();
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDs1JZXpgr-IZdjI8Uoc0AREm_ur3eqnOM",
            authDomain: "nyccardbase.firebaseapp.com",
            projectId: "nyccardbase",
            storageBucket: "nyccardbase.firebasestorage.app",
            messagingSenderId: "964924272872",
            appId: "1:964924272872:web:069f2e91bcc4c2d5d1195d",
            measurementId: "G-5HS5LKVG1V"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('navDashboard').style.display = 'block';
            } else {
                document.getElementById('navDashboard').style.display = 'none';
            }
        });
    </script>
</body>

</html>
